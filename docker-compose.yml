services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: caelum-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - caelum-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: caelum-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - caelum-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: caelum-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caelum_geoint}
      POSTGRES_USER: ${POSTGRES_USER:-caelum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caelum_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - caelum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caelum_user} -d ${POSTGRES_DB:-caelum_geoint}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: caelum-ingestion-worker
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_STAC_INGEST: geoint-stac-ingest
      CDSE_STAC_API_URL: https://catalogue.dataspace.copernicus.eu/stac
      POLL_INTERVAL_SECONDS: 300
    volumes:
      - ./services/ingestion:/app/services/ingestion
      - ./data:/app/data
    networks:
      - caelum-network

networks:
  caelum-network:
    driver: bridge

volumes:
  postgis_data:
    driver: local
