services:
  # 1. Spatial Database
  postgis:
    image: postgis/postgis:15-3.3
    container_name: caelum-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caelum_geoint}
      POSTGRES_USER: ${POSTGRES_USER:-caelum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caelum_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - caelum-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caelum_user} -d ${POSTGRES_DB:-caelum_geoint}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Object Storage
  minio:
    image: minio/minio:latest
    container_name: caelum-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - caelum-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: caelum-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/caelum-raw;
      /usr/bin/mc mb --ignore-existing local/caelum-interim;
      /usr/bin/mc mb --ignore-existing local/caelum-chips;
      exit 0;
      "
    networks:
      - caelum-net

  # 3. Lightweight Event Streaming Broker (Redpanda)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: caelum-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    networks:
      - caelum-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. ETL Worker Container
  worker-etl:
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: caelum-worker-etl
    command: ["python", "-m", "src.ingestion.stac_poller", "--once"]
    depends_on:
      redpanda:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC_STAC_INGEST: geoint-stac-ingest
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      CAELUM_MOCK_INGEST: "true"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - caelum-net

  # 5. ML Inference Worker Container
  worker-inference:
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: caelum-worker-inference
    command: ["python", "-m", "src.inference.detector", "--mock-single"]
    depends_on:
      postgis:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-caelum_geoint}
      POSTGRES_USER: ${POSTGRES_USER:-caelum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caelum_secure_password}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./src:/app/src
      - ./weights:/app/weights
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - caelum-net

  # 6. Deck.gl WebGL Visualization Frontend
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: caelum-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_PORT=3000
    networks:
      - caelum-net

  # 7. High-Performance Vector Tile Server (Martin MVT)
  martin:
    image: maplibre/martin:latest
    container_name: caelum-martin
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-caelum_user}:${POSTGRES_PASSWORD:-caelum_secure_password}@postgis:5432/${POSTGRES_DB:-caelum_geoint}
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - caelum-net

  # 8. Dynamic Raster Tile Server (TiTiler for COGs)
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: caelum-titiler
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_VIRTUAL_HOSTING: "FALSE"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - caelum-net

networks:
  caelum-net:
    driver: bridge

volumes:
  postgis_data:
    driver: local
  minio_data:
    driver: local
