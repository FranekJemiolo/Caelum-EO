name: Caelum-EO CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared uv cache path across all jobs
env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting, Formatting & Type Hygiene
  # ----------------------------------------------------------------------------
  lint-and-format:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python 3.13
        run: uv python install 3.13

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "src/frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Project (dev group) via uv
        run: uv sync --group dev

      - name: Cache Pre-commit Environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: uv tool install pre-commit --python 3.13

      - name: Run Pre-commit Hooks
        run: uv tool run pre-commit run --all-files

  # ----------------------------------------------------------------------------
  # Job 2: Backend Integration & Unit Tests with Coverage Gate
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests & PostGIS Integration
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: caelum_geoint
          POSTGRES_USER: caelum_user
          POSTGRES_PASSWORD: caelum_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caelum_user -d caelum_geoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python 3.13
        run: uv python install 3.13

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin postgresql-client

      - name: Install Project (dev group) via uv
        run: uv sync --group dev

      - name: Apply PostGIS Database Schema
        run: |
          PGPASSWORD=caelum_secure_password psql \
            -h localhost -p 5432 -U caelum_user -d caelum_geoint \
            -f src/db/init.sql

      - name: Execute Backend Tests with Coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: caelum_geoint
          POSTGRES_USER: caelum_user
          POSTGRES_PASSWORD: caelum_secure_password
          CAELUM_MOCK_INGEST: "true"
        run: |
          uv run pytest tests/ \
            --cov=src --cov-report=term-missing

  # ----------------------------------------------------------------------------
  # Job 3: Frontend Build & Lint Verification
  # ----------------------------------------------------------------------------
  frontend-quality:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "src/frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: src/frontend
        run: npm run lint

      - name: Build Production WebGL Bundle
        working-directory: src/frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 4: Docker Compose Orchestration Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
