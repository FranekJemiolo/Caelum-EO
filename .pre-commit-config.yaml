# Pre-commit configuration for Project Caelum-EO
# Repository: github.com/FranekJemiolo/Caelum-EO

repos:
  # 1. Standard Hygiene Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=10240']

  # 2. Python Quality: Ruff (Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 3. Python Type Checking: mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        files: ^(src/|tests/)
        additional_dependencies:
          - pydantic>=2.7.0
          - types-requests
          - types-PyYAML

  # 4. Frontend Formatting: Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [json, markdown, css, ts, tsx]
        exclude: ^(src/frontend/dist/|src/frontend/node_modules/|src/frontend/package-lock\.json)

  # 5. Frontend Linting: ESLint
  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend-eslint
        entry: bash -c "cd src/frontend && npm run lint"
        language: system
        files: ^src/frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
