# Pre-commit configuration for Project Caelum-EO
# Venv management: uv  (https://docs.astral.sh/uv/)
# Run:  uv run pre-commit run --all-files

repos:
  # 1. Standard Hygiene Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=10240"]

  # 2. Python Quality: Ruff — local hook so it uses the SAME binary version
  #    as the project lockfile (uv.lock), preventing version drift between
  #    pre-commit's isolated env and the project venv.
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint (uv run)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, markdown]
        pass_filenames: true

      - id: ruff-format
        name: ruff format (uv run)
        entry: uv run ruff format
        language: system
        types_or: [python, markdown]
        pass_filenames: true

  # 3. Python Type Checking via uv run (uses the project .venv)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy src/ tests/ --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false

  # 4. Frontend Formatting: Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [json, markdown, css, ts, tsx]
        exclude: >
          (?x)^(
            src/frontend/dist/|
            src/frontend/node_modules/|
            src/frontend/package-lock\.json
          )

  # 5. Frontend Linting: ESLint (via npm)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend-eslint
        entry: bash -c "cd src/frontend && npm run lint"
        language: system
        files: ^src/frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
