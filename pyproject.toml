[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caelum-eo"
version = "0.1.0"
description = "Automated GEOINT Infrastructure Pipeline using Open-Source Earth Observation AI Models"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Franek Jemiolo", email = "franek.jemiolo@example.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Geospatial
    "pystac-client>=0.9.0",
    "planetary-computer>=1.0.0",
    "rasterio>=1.5.0",
    "xarray>=2024.11.0",
    "shapely>=2.1.0",
    "geopandas>=1.0.0",
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "python-dateutil>=2.9.0",
    # Data / Messaging
    "kafka-python>=2.0.2",
    "psycopg2-binary>=2.9.10",
    # Imaging
    "Pillow>=11.0.0",
    # Object storage
    "boto3>=1.38.0",
    # API / Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.20",
    # Observability
    "structlog>=25.1.0",
    "tenacity>=9.0.0",
    "click>=8.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.4.10",
    "mypy>=2.0.0",
    "types-requests",
    "types-PyYAML",
    "types-python-dateutil",
]

# PEP 735 / uv dependency groups (preferred over [tool.uv] dev-dependencies)
[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.4.10",
    "mypy>=2.0.0",
    "types-requests",
    "types-PyYAML",
    "types-python-dateutil",
]
ml = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "ultralytics>=8.3.0",
    "timm>=1.0.0",
    "segment-anything>=1.0",
]

[project.urls]
Homepage = "https://github.com/FranekJemiolo/Caelum-EO"
Repository = "https://github.com/FranekJemiolo/Caelum-EO.git"
Issues = "https://github.com/FranekJemiolo/Caelum-EO/issues"

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
# uv uses [dependency-groups] above; this section holds uv-specific settings only
package = true

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
pythonpath = ["."]
testpaths = [
    "tests",
    "services/ingestion/tests",
    "services/inference/tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = [
    "src/frontend/*",
    "*/migrations/*",
    # ML inference modules require torch (ml extra) — excluded from the
    # non-ML CI coverage gate; covered separately in the ml test job.
    "src/inference/detector.py",
    "src/inference/prithvi_detector.py",
    "src/inference/multimodal_detector.py",
    "src/inference/vectorizer.py",
    "src/inference/yolo_classifier.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
fail_under = 80
