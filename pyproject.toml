[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caelum-eo"
version = "0.1.0"
description = "Automated GEOINT Infrastructure Pipeline using Open-Source Earth Observation AI Models"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Franek Jemiolo", email = "franek.jemiolo@example.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pystac-client>=0.7.6",
    "planetary-computer>=1.0.0",
    "kafka-python>=2.0.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rasterio>=1.3.9",
    "xarray>=2024.3.0",
    "shapely>=2.0.3",
    "geopandas>=0.14.3",
    "numpy>=1.26.0,<2.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
    "click>=8.1.7",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0"
]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
    "timm>=0.9.16",
    "segment-anything>=1.0"
]

[project.urls]
Homepage = "https://github.com/FranekJemiolo/Caelum-EO"
Repository = "https://github.com/FranekJemiolo/Caelum-EO.git"
Issues = "https://github.com/FranekJemiolo/Caelum-EO/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
pythonpath = ["."]
testpaths = [
    "tests",
    "services/ingestion/tests",
    "services/inference/tests"
]
